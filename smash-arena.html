<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ARENA — 乱闘ゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d18;
    --bg2: #10152a;
    --grid: #1c2440;
    --cyan: #4fe3ff;
    --magenta: #ff4fd8;
    --gold: #ffcf4f;
    --text: #e8ecff;
    --dim: #7783a8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Space Mono', monospace; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{
    position:relative; width:960px; max-width:100vw; aspect-ratio:16/9;
    background:radial-gradient(ellipse at 50% 20%, var(--bg2), var(--bg) 70%);
    border:2px solid var(--grid); box-shadow:0 0 60px rgba(79,227,255,0.08), inset 0 0 80px rgba(0,0,0,0.6);
    overflow:hidden;
  }
  canvas{ position:absolute; top:0; left:0; width:100%; height:100%; display:block; }
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; z-index:5; text-align:center; padding:20px;
  }
  .hidden{ display:none !important; }
  h1.logo{
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:56px; letter-spacing:6px; margin:0;
    color:var(--text); text-shadow:0 0 18px var(--cyan), 0 0 40px rgba(79,227,255,0.4);
  }
  h1.logo span{ color:var(--magenta); text-shadow:0 0 18px var(--magenta), 0 0 40px rgba(255,79,216,0.4); }
  .sub{ color:var(--dim); font-size:12px; letter-spacing:3px; text-transform:uppercase; }
  .blink{ animation:blink 1.4s infinite; font-family:'Orbitron',sans-serif; letter-spacing:2px; font-size:14px; color:var(--gold); margin-top:20px; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.15;} }
  .panel{
    background:rgba(16,21,42,0.7); border:1px solid var(--grid); border-radius:4px; padding:18px 26px;
    font-size:12px; line-height:1.9; color:var(--dim); text-align:left;
  }
  .panel b{ color:var(--text); }
  .selectRow{ display:flex; gap:40px; }
  .fighterCol{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    border:1px solid var(--grid); padding:16px; border-radius:4px; background:rgba(16,21,42,0.5); width:220px;
  }
  .fighterCol h3{ font-family:'Orbitron',sans-serif; font-size:14px; letter-spacing:2px; margin:0; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .chip{
    border:1px solid var(--grid); background:rgba(255,255,255,0.03); color:var(--dim); font-size:11px;
    padding:6px 10px; border-radius:20px; cursor:pointer; font-family:'Space Mono',monospace; letter-spacing:1px;
  }
  .chip.active{ border-color:var(--cyan); color:var(--text); box-shadow:0 0 10px rgba(79,227,255,0.35); }
  .chip.active.p2{ border-color:var(--magenta); box-shadow:0 0 10px rgba(255,79,216,0.35); }
  .swatches{ display:flex; gap:6px; }
  .sw{ width:20px; height:20px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .sw.active{ border-color:#fff; }
  button.big{
    font-family:'Orbitron',sans-serif; font-weight:700; letter-spacing:2px; font-size:15px;
    background:linear-gradient(135deg, var(--cyan), var(--magenta)); color:#0a0d18; border:none;
    padding:12px 30px; border-radius:2px; cursor:pointer;
  }
  button.big:hover{ filter:brightness(1.15); }
  button.ghost{
    font-family:'Space Mono',monospace; background:transparent; border:1px solid var(--grid); color:var(--dim);
    padding:8px 18px; border-radius:2px; cursor:pointer; letter-spacing:1px; font-size:11px;
  }
  #hud{ position:absolute; top:0; left:0; width:100%; padding:10px 16px; display:flex; justify-content:space-between; z-index:4; pointer-events:none; }
  .stat{ font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:1px; }
  .stat .pct{ font-size:26px; font-weight:900; }
  .stat.p1{ color:var(--cyan); text-align:left; }
  .stat.p2{ color:var(--magenta); text-align:right; }
  .stocks{ letter-spacing:3px; margin-top:2px; }
  #timer{ position:absolute; top:8px; left:50%; transform:translateX(-50%); font-family:'Orbitron',sans-serif; font-size:20px; z-index:4; }
  #resultText{ font-family:'Orbitron',sans-serif; font-size:34px; letter-spacing:3px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="hud" class="hidden">
    <div class="stat p1">
      <div>PLAYER 1</div>
      <div class="pct" id="p1pct">0%</div>
      <div class="stocks" id="p1stocks">●●●</div>
    </div>
    <div class="stat p2">
      <div>PLAYER 2 <span id="p2cpuTag"></span></div>
      <div class="pct" id="p2pct">0%</div>
      <div class="stocks" id="p2stocks">●●●</div>
    </div>
  </div>
  <div id="timer" class="hidden">2:00</div>

  <div id="titleScreen" class="screen">
    <h1 class="logo">NEON<span>ARENA</span></h1>
    <div class="sub">乱闘フィジックス・ファイター</div>
    <div class="panel">
      <div><b>操作方法 — PLAYER 1</b>：A/D 移動｜W ジャンプ｜S シールド｜F 攻撃｜G つかみ</div>
      <div><b>操作方法 — PLAYER 2</b>：←/→ 移動｜↑ ジャンプ｜↓ シールド｜Enter 攻撃｜Shift つかみ</div>
      <div>ダメージ%が高いほど吹っ飛びが大きくなる。画面外（バーストライン）に出たら撃墜。</div>
    </div>
    <div class="blink">PRESS SPACE TO START</div>
  </div>

  <div id="selectScreen" class="screen hidden">
    <h1 class="logo" style="font-size:32px;">FIGHTER SELECT</h1>
    <div class="selectRow">
      <div class="fighterCol">
        <h3 style="color:var(--cyan)">PLAYER 1</h3>
        <div class="chips" id="p1types"></div>
        <div class="swatches" id="p1colors"></div>
      </div>
      <div class="fighterCol">
        <h3 style="color:var(--magenta)">PLAYER 2</h3>
        <div class="chips" id="p2types"></div>
        <div class="swatches" id="p2colors"></div>
        <div class="chips"><div class="chip" id="cpuToggle">CPU: OFF</div></div>
      </div>
    </div>
    <button class="big" id="startMatchBtn">FIGHT!</button>
  </div>

  <div id="resultScreen" class="screen hidden">
    <div id="resultText">WINNER</div>
    <button class="ghost" id="rematchBtn">TITLE へ戻る</button>
  </div>
</div>

<script>
(() => {
"use strict";
const CV = document.getElementById('c');
const CTX = CV.getContext('2d');
const W = 960, H = 540;

// ---------- STAGE ----------
const STAGE = {
  floor: {x:130, y:400, w:700, h:40},
  platforms: [
    {x:220, y:290, w:190, h:16, drop:true},
    {x:550, y:290, w:190, h:16, drop:true},
    {x:400, y:190, w:160, h:16, drop:true},
  ],
  blast: {left:-140, right:W+140, top:-180, bottom:H+140},
};
const GRAVITY = 0.62, FALL_GRAVITY_MULT = 1.0, MAX_FALL = 13;
const FIGHTER_TYPES = {
  balanced: {label:'BALANCED', weight:100, speed:4.2, jump:12.5, dash:6.2, size:34},
  heavy:    {label:'HEAVY',    weight:140, speed:3.3, jump:11.2, dash:5.2, size:40},
  light:    {label:'LIGHT',    weight:70,  speed:5.1, jump:13.6, dash:7.2, size:28},
};
const COLORS = ['#4fe3ff','#ff4fd8','#ffcf4f','#7dff8a'];

// ---------- INPUT ----------
const keysDown = new Set();
const keysPressed = new Set(); // edge-triggered, cleared each tick
window.addEventListener('keydown', e=>{
  if(!keysDown.has(e.code)) keysPressed.add(e.code);
  keysDown.add(e.code);
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keysDown.delete(e.code); });

const P1_KEYS = {left:'KeyA', right:'KeyD', up:'KeyW', down:'KeyS', shield:'KeyS', attack:'KeyF', grab:'KeyG'};
const P2_KEYS = {left:'ArrowLeft', right:'ArrowRight', up:'ArrowUp', down:'ArrowDown', shield:'ArrowDown', attack:'Enter', grab:'ShiftRight'};

// ---------- GAME STATE ----------
let gameState = 'TITLE'; // TITLE, SELECT, MATCH, RESULT
let hitstop = 0;
let shake = 0;
let particles = [];
let matchTimer = 120*60; // frames, 2 min at 60fps
let players = [];
let select = {
  p1type:'balanced', p2type:'balanced',
  p1color:0, p2color:1,
  p2cpu:false,
};

// ---------- PLAYER FACTORY ----------
function createPlayer(id, x, color, type, isCPU, keys){
  const t = FIGHTER_TYPES[type];
  return {
    id, color, type, isCPU, keys,
    x, y: STAGE.floor.y - t.size, vx:0, vy:0,
    w: t.size, h: t.size*1.6,
    weight: t.weight, speedCap: t.speed, dashCap: t.dash, jumpPow: t.jump,
    facing: id===1 ? 1 : -1,
    damagePercent: 0, stocks: 3,
    state: 'idle', stateTimer: 0,
    onGround: false, standingPlatform: null,
    jumpsLeft: 2, maxJumps: 2,
    shieldHP: 100, isShielding:false,
    dirHoldFrames: 0, lastDirTapFrame: -999, lastDir: 0, frameCount:0,
    hitstunFrames: 0, invincible: 0,
    attack: null, // {type, hitboxTimer, activeFrom, activeTo, hit:false, power, angle, hitstun}
    grabbing: null, grabbedBy: null,
    downTimer: 0, techWindowUsed:false,
    helpless: false,
    ledge: false,
    respawnTimer: 0,
    aiTimer: 0, aiState:'approach',
  };
}

function resetMatch(){
  const c1 = COLORS[select.p1color], c2 = COLORS[select.p2color];
  players = [
    createPlayer(1, 330, c1, select.p1type, false, P1_KEYS),
    createPlayer(2, 630, c2, select.p2type, select.p2cpu, P2_KEYS),
  ];
  matchTimer = 120*60;
  particles = [];
  hitstop = 0; shake = 0;
  document.getElementById('p2cpuTag').textContent = select.p2cpu ? '[CPU]' : '';
}

// ---------- STATE MACHINE RULES ----------
// which states allow which actions
function canMove(p){ return ['idle','walk','dash','jump','fall'].includes(p.state); }
function canAct(p){ return ['idle','walk','dash','jump','fall'].includes(p.state); }
function isFrozen(p){ return ['hitstun','grabbed','shieldbreak','down','grab_lag'].includes(p.state); }

function setState(p, s){
  if(p.state === s) return;
  p.state = s; p.stateTimer = 0;
}

// ---------- INPUT READING (handles CPU) ----------
function readInput(p, other){
  if(p.isCPU) return aiInput(p, other);
  const k = p.keys;
  return {
    left: keysDown.has(k.left), right: keysDown.has(k.right),
    up: keysPressed.has(k.up), upHeld: keysDown.has(k.up),
    down: keysDown.has(k.down),
    shield: keysDown.has(k.shield),
    attackPressed: keysPressed.has(k.attack),
    grabPressed: keysPressed.has(k.grab),
  };
}

// ---------- SIMPLE CPU AI ----------
function aiInput(p, other){
  p.aiTimer--;
  const dx = other.x - p.x;
  const dist = Math.abs(dx);
  const nearBlast = p.x < STAGE.blast.left+220 || p.x > STAGE.blast.right-220 || p.y < STAGE.blast.top+180;
  const out = {left:false,right:false,up:false,upHeld:false,down:false,shield:false,attackPressed:false,grabPressed:false};

  // priority: recover to stage if near blast zone and airborne
  if(nearBlast && !p.onGround){
    const targetX = (STAGE.floor.x + STAGE.floor.w/2);
    if(p.x < targetX) out.right = true; else out.left = true;
    if(p.y > 150 && (p.jumpsLeft>0 || !p.helpless)) out.up = true;
    return out;
  }

  if(p.aiTimer <= 0){
    p.aiTimer = 20 + Math.floor(Math.random()*20);
    const heavyDamage = p.damagePercent > 70;
    const r = Math.random();
    if(heavyDamage && r < 0.35) p.aiState = 'evade';
    else if(dist < 70) p.aiState = 'attack';
    else p.aiState = 'approach';
  }

  if(p.aiState === 'approach'){
    if(dx > 12) out.right = true;
    else if(dx < -12) out.left = true;
    if(other.y < p.y - 40 && p.onGround) out.up = true;
  } else if(p.aiState === 'attack'){
    if(dist < 65){
      out.attackPressed = Math.random() < 0.5;
      out.grabPressed = !out.attackPressed && Math.random() < 0.15;
      if(dx>0) out.right = true; else out.left = true;
    } else {
      if(dx>0) out.right = true; else out.left = true;
    }
  } else if(p.aiState === 'evade'){
    out.shield = Math.random() < 0.6;
    if(!out.shield && Math.random()<0.3) out.up = true;
    if(dx>0) out.left = true; else out.right = true;
  }
  return out;
}

// ---------- PHYSICS / KNOCKBACK ----------
function applyKnockback(target, attacker, atk){
  const kb = ((atk.power * (target.damagePercent + 5)) / target.weight) * 1.15 + atk.baseKnockback;
  const rad = atk.angle * Math.PI/180;
  const dir = attacker.x < target.x ? 1 : -1;
  target.vx = Math.cos(rad) * kb * dir;
  target.vy = -Math.sin(rad) * kb;
  target.damagePercent += atk.damage;
  target.hitstunFrames = Math.max(6, Math.floor(kb * 1.4));
  setState(target, 'hitstun');
  target.onGround = false;
  target.standingPlatform = null;

  hitstop = Math.min(14, 3 + Math.floor(atk.damage/2));
  shake = Math.min(10, 2 + atk.damage/3);
  spawnParticles(target.x, target.y - target.h/2, target.color);
}

function spawnParticles(x,y,color){
  for(let i=0;i<10;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:18+Math.random()*10, color});
  }
}

// ---------- ATTACK DEFINITIONS ----------
function startAttack(p, isSmash, isAerial){
  const base = isAerial ? {damage:9, power:7, angle:40, baseKnockback:2, w:46, h:30, startup:4, active:6, total:16}
                         : isSmash ? {damage:15, power:12, angle:35, baseKnockback:4, w:50, h:26, startup:8, active:6, total:26}
                         : {damage:6, power:5, angle:45, baseKnockback:2, w:38, h:22, startup:3, active:5, total:14};
  p.attack = {...base, timer:0, hit:false, isSmash, isAerial};
  setState(p, 'attack');
}

function updateAttackHitbox(p, other){
  if(!p.attack) return;
  const a = p.attack;
  a.timer++;
  if(a.timer >= a.startup && a.timer < a.startup+a.active && !a.hit){
    const hbX = p.x + p.facing * (p.w/2 + a.w/2 - 6);
    const hbY = p.y - p.h/2;
    if(rectOverlap(hbX-a.w/2, hbY-a.h/2, a.w, a.h, other.x-other.w/2, other.y-other.h, other.w, other.h) && other.invincible<=0){
      a.hit = true;
      if(other.isShielding){
        other.shieldHP -= a.damage*3.4;
        p.vx = -p.facing*2;
        if(other.shieldHP <= 0){
          other.shieldHP = 0;
          setState(other,'shieldbreak');
          other.isShielding = false;
          other.hitstunFrames = 180;
        }
        hitstop = 4; shake=2;
      } else {
        applyKnockback(other, p, a);
      }
    }
  }
  if(a.timer >= a.total){
    p.attack = null;
    if(p.state === 'attack') setState(p, p.onGround ? 'idle' : 'fall');
  }
}

function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

// ---------- GRAB / THROW ----------
function startGrab(p, other){
  const gx = p.x + p.facing*(p.w/2+18);
  if(Math.abs(gx - other.x) < 26 && Math.abs(p.y - other.y) < other.h && other.state!=='hitstun' && !other.grabbedBy){
    other.grabbedBy = p;
    p.grabbing = other;
    setState(other, 'grabbed');
    setState(p, 'grabbing');
  } else {
    setState(p, 'grab_lag');
    p.stateTimerMax = 14;
  }
}

function doThrow(p, other, dir){
  const atk = {damage: 8, power: 6, baseKnockback: 3,
    angle: dir==='up'?80: dir==='down'?-15: 25};
  if(dir==='forward'){ atk.angle=25; }
  if(dir==='back'){ p.facing*=-1; atk.angle=25; }
  other.grabbedBy = null; p.grabbing = null;
  applyKnockback(other, p, {...atk, damage:8});
  setState(p, 'idle');
}

// ---------- MAIN PLAYER UPDATE ----------
function updatePlayer(p, other, dt){
  p.frameCount++;
  const input = readInput(p, other);
  if(p.invincible>0) p.invincible--;

  // ---- GRABBED: fully controlled by grabber ----
  if(p.state === 'grabbed'){
    p.x = p.grabbedBy.x + p.grabbedBy.facing*30;
    p.y = p.grabbedBy.y;
    p.vx = 0; p.vy = 0;
    return;
  }

  // ---- GRABBING: read throw direction ----
  if(p.state === 'grabbing'){
    p.vx = 0;
    if(input.up){ doThrow(p, p.grabbing, 'up'); }
    else if(input.down){ doThrow(p, p.grabbing, 'down'); }
    else if((input.left && p.facing===1)||(input.right && p.facing===-1)){ doThrow(p, p.grabbing, 'back'); }
    else if((input.right && p.facing===1)||(input.left && p.facing===-1)){ doThrow(p, p.grabbing, 'forward'); }
    return;
  }

  if(p.state === 'grab_lag'){
    p.stateTimer++;
    if(p.stateTimer > (p.stateTimerMax||14)) setState(p, p.onGround?'idle':'fall');
  }

  if(p.state === 'shieldbreak'){
    p.stateTimer++;
    if(p.stateTimer > 180) setState(p, 'idle');
    p.vx *= 0.9;
  }

  // ---- HITSTUN ----
  if(p.state === 'hitstun'){
    p.hitstunFrames--;
    if(p.hitstunFrames <= 0){
      setState(p, p.onGround ? 'idle' : (p.vy < -3 ? 'jump':'fall'));
    }
  }

  // ---- DOWN / TECH ----
  if(p.state === 'down'){
    p.stateTimer++;
    p.vx *= 0.85;
    if((input.attackPressed || input.up) && p.stateTimer < 60){
      setState(p, 'idle');
    } else if(p.stateTimer > 55){
      setState(p, 'idle');
    }
  }

  // ---- MOVEMENT input (only in movement-eligible states) ----
  if(canMove(p) && p.state!=='attack'){
    let dir = 0;
    if(input.left && !input.right) dir = -1;
    else if(input.right && !input.left) dir = 1;

    if(dir !== 0){
      p.facing = dir;
      const tapGap = p.frameCount - p.lastDirTapFrame;
      if(dir !== p.lastDir){
        // fresh direction press: check for dash-worthy quick re-tap
        if(dir === p.prevReleasedDir && tapGap < 12 && p.onGround){
          setState(p, 'dash');
        } else if(p.onGround && p.state !== 'dash'){
          setState(p, 'walk');
        }
        p.lastDirTapFrame = p.frameCount;
      }
      p.lastDir = dir;
      const cap = p.state === 'dash' ? p.dashCap : p.speedCap;
      const accel = p.onGround ? 0.9 : 0.55;
      p.vx += dir*accel;
      if(Math.abs(p.vx) > cap) p.vx = cap*dir;
    } else {
      if(p.lastDir !== 0){ p.prevReleasedDir = p.lastDir; p.lastDirTapFrame = p.frameCount; }
      p.lastDir = 0;
      p.vx *= p.onGround ? 0.78 : 0.94;
      if(p.onGround && p.state!=='attack' && Math.abs(p.vx)<0.3) setState(p, 'idle');
    }
  }

  // ---- SHIELD ----
  if(input.shield && p.onGround && (canAct(p) || p.state==='shield')){
    setState(p, 'shield');
    p.isShielding = true;
    p.vx *= 0.5;
    p.shieldHP = Math.min(100, p.shieldHP + 0.15);
  } else if(p.state === 'shield'){
    p.isShielding = false;
    setState(p, 'idle');
  }

  // ---- JUMP ----
  if(input.up && canAct(p) && !p.isShielding){
    if(p.onGround){
      p.vy = -p.jumpPow; p.onGround = false; p.standingPlatform=null; setState(p,'jump'); p.jumpsLeft = p.maxJumps-1;
    } else if(p.jumpsLeft > 0 && !p.helpless){
      p.vy = -p.jumpPow*0.92; p.jumpsLeft--; setState(p,'jump');
      spawnParticles(p.x, p.y, p.color);
    }
  }

  // ---- UP-SPECIAL (double-tap up while airborne and no jumps, or explicit key combo: up+attack) ----
  if(!p.onGround && input.attackPressed && input.upHeld && p.jumpsLeft<=0 && !p.helpless && p.state!=='attack'){
    p.vy = -14; p.vx = p.facing*3;
    p.helpless = true;
    setState(p, 'helpless');
    spawnParticles(p.x,p.y,p.color);
  }

  // ---- DROP THROUGH PLATFORM (hold down on a droppable platform) ----
  if(p.onGround && p.standingPlatform && p.standingPlatform.drop && input.down){
    p.dropHoldFrames = (p.dropHoldFrames||0) + 1;
    if(p.dropHoldFrames > 5){
      p.y += 8; p.onGround = false; p.standingPlatform = null; p.dropCooldown = 14;
      p.dropHoldFrames = 0; setState(p,'fall');
    }
  } else {
    p.dropHoldFrames = 0;
  }
  if(p.dropCooldown > 0) p.dropCooldown--;

  // ---- ATTACK ----
  if(input.attackPressed && canAct(p) && !p.isShielding && p.state!=='helpless'){
    const isSmash = (p.frameCount - p.lastDirTapFrame) < 5 && p.lastDir !== 0;
    startAttack(p, isSmash, !p.onGround);
  }
  if(p.state === 'attack') updateAttackHitbox(p, other);

  // ---- GRAB ----
  if(input.grabPressed && canAct(p) && p.onGround && !p.isShielding){
    startGrab(p, other);
  }

  // ---- LEDGE GRAB ----
  const edgeL = STAGE.floor.x, edgeR = STAGE.floor.x+STAGE.floor.w;
  if(!p.onGround && p.state!=='ledge' && p.vy>0){
    if(Math.abs(p.x-edgeL)<20 && p.y > STAGE.floor.y-20 && p.y < STAGE.floor.y+30 && p.facing===-1){
      setState(p,'ledge'); p.vx=0; p.vy=0; p.x=edgeL; p.invincible=40; p.helpless=false; p.jumpsLeft=p.maxJumps;
    } else if(Math.abs(p.x-edgeR)<20 && p.y > STAGE.floor.y-20 && p.y < STAGE.floor.y+30 && p.facing===1){
      setState(p,'ledge'); p.vx=0; p.vy=0; p.x=edgeR; p.invincible=40; p.helpless=false; p.jumpsLeft=p.maxJumps;
    }
  }
  if(p.state==='ledge'){
    if(input.up || input.attackPressed){
      setState(p,'jump'); p.vy=-p.jumpPow*0.8; p.vx=p.facing*-2;
    }
    return;
  }

  // ---- GRAVITY ----
  if(!p.onGround){
    p.vy += GRAVITY;
    if(p.vy > MAX_FALL) p.vy = MAX_FALL;
    if(p.vy > 2 && p.state!=='attack' && p.state!=='hitstun' && p.state!=='helpless') setState(p,'fall');
  }

  // ---- INTEGRATE ----
  p.x += p.vx;
  p.y += p.vy;

  // ---- FLOOR / PLATFORM COLLISION ----
  let landed = false;
  const feet = p.y;
  if(p.vy >= 0){
    // main floor
    if(p.x > STAGE.floor.x-p.w/2 && p.x < STAGE.floor.x+STAGE.floor.w+p.w/2 && feet >= STAGE.floor.y && feet - p.vy <= STAGE.floor.y+2){
      p.y = STAGE.floor.y; p.vy = 0; landed = true; p.standingPlatform = STAGE.floor;
    } else if(!(p.dropCooldown > 0)) {
      for(const pl of STAGE.platforms){
        if(p.x > pl.x-p.w/2 && p.x < pl.x+pl.w+p.w/2 && feet >= pl.y && feet - p.vy <= pl.y+2){
          p.y = pl.y; p.vy = 0; landed = true; p.standingPlatform = pl;
          break;
        }
      }
    }
  }
  if(landed){
    const wasFalling = !p.onGround;
    p.onGround = true;
    p.jumpsLeft = p.maxJumps;
    p.helpless = false;
    if(p.state==='hitstun' || (wasFalling && p.hitstunFrames>0)){
      p.hitstunFrames = 0;
      setState(p,'down');
      p.techWindowUsed = false;
    } else if(p.state==='fall' || p.state==='jump' || p.state==='helpless'){
      setState(p, Math.abs(p.vx)>0.4 ? 'walk' : 'idle');
    }
  } else {
    p.onGround = false;
  }

  // ---- STAGE HORIZONTAL BOUNDS (soft) ----
  if(p.x < -300 || p.x > W+300) { /* handled by blast check below */ }

  // ---- BLAST ZONES ----
  if(p.x < STAGE.blast.left || p.x > STAGE.blast.right || p.y < STAGE.blast.top || p.y > STAGE.blast.bottom){
    loseStock(p);
  }
}

function loseStock(p){
  p.stocks--;
  spawnParticles(p.x, Math.max(60,Math.min(H-60,p.y)), p.color);
  if(p.stocks <= 0){
    endMatch(p.id === 1 ? 2 : 1);
    return;
  }
  p.x = W/2 + (p.id===1?-120:120);
  p.y = 60;
  p.vx = 0; p.vy = 0;
  p.damagePercent = 0;
  p.jumpsLeft = p.maxJumps;
  p.helpless = false;
  p.invincible = 90;
  setState(p, 'fall');
}

// ---------- MATCH LOOP ----------
function updateMatch(){
  if(hitstop > 0){ hitstop--; return; }
  matchTimer--;
  if(matchTimer <= 0){
    const [a,b] = players;
    if(a.damagePercent < b.damagePercent) endMatch(1);
    else if(b.damagePercent < a.damagePercent) endMatch(2);
    else endMatch(0);
    return;
  }
  const [a,b] = players;
  updatePlayer(a,b);
  updatePlayer(b,a);

  particles.forEach(pt=>{ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.15; pt.life--; });
  particles = particles.filter(pt=>pt.life>0);
  if(shake>0) shake *= 0.85; if(shake<0.1) shake=0;

  keysPressed.clear();
  updateHUD();
}

function updateHUD(){
  const [a,b] = players;
  document.getElementById('p1pct').textContent = Math.floor(a.damagePercent)+'%';
  document.getElementById('p2pct').textContent = Math.floor(b.damagePercent)+'%';
  document.getElementById('p1stocks').textContent = '●'.repeat(Math.max(0,a.stocks));
  document.getElementById('p2stocks').textContent = '●'.repeat(Math.max(0,b.stocks));
  const secs = Math.ceil(matchTimer/60);
  document.getElementById('timer').textContent = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
}

function endMatch(winnerId){
  gameState = 'RESULT';
  show('resultScreen');
  const t = document.getElementById('resultText');
  t.textContent = winnerId===0 ? 'TIME UP — DRAW' : `PLAYER ${winnerId} WINS!`;
  t.style.color = winnerId===1 ? 'var(--cyan)' : winnerId===2 ? 'var(--magenta)' : 'var(--gold)';
}

// ---------- RENDER ----------
function render(){
  CTX.save();
  CTX.clearRect(0,0,W,H);

  if(gameState !== 'MATCH' && gameState !== 'RESULT'){ CTX.restore(); return; }

  // camera
  let camX=0, camY=0, zoom=1;
  if(players.length===2){
    const [a,b] = players;
    const midX = (a.x+b.x)/2, midY = (a.y+b.y)/2 - 60;
    const dist = Math.hypot(a.x-b.x, a.y-b.y);
    zoom = Math.max(0.72, Math.min(1, 420/Math.max(300,dist)));
    camX = W/2 - midX*zoom;
    camY = H/2 - midY*zoom;
  }
  const sx = (shake>0)? (Math.random()-0.5)*shake : 0;
  const sy = (shake>0)? (Math.random()-0.5)*shake : 0;

  // bg grid
  CTX.fillStyle = '#0a0d18';
  CTX.fillRect(0,0,W,H);
  CTX.strokeStyle = 'rgba(79,227,255,0.06)';
  CTX.lineWidth = 1;
  for(let gx=0; gx<W; gx+=40){ CTX.beginPath(); CTX.moveTo(gx,0); CTX.lineTo(gx,H); CTX.stroke(); }
  for(let gy=0; gy<H; gy+=40){ CTX.beginPath(); CTX.moveTo(0,gy); CTX.lineTo(W,gy); CTX.stroke(); }

  CTX.translate(camX+sx, camY+sy);
  CTX.scale(zoom, zoom);

  // floor
  const fl = STAGE.floor;
  const flGrad = CTX.createLinearGradient(0,fl.y,0,fl.y+fl.h);
  flGrad.addColorStop(0,'#2a3560'); flGrad.addColorStop(1,'#141a30');
  CTX.fillStyle = flGrad;
  CTX.fillRect(fl.x, fl.y, fl.w, fl.h);
  CTX.strokeStyle = 'rgba(79,227,255,0.5)'; CTX.lineWidth=2;
  CTX.strokeRect(fl.x, fl.y, fl.w, 2);

  // platforms
  STAGE.platforms.forEach(pl=>{
    CTX.fillStyle = 'rgba(255,79,216,0.25)';
    CTX.fillRect(pl.x, pl.y, pl.w, pl.h);
    CTX.strokeStyle = 'rgba(255,79,216,0.7)'; CTX.lineWidth=2;
    CTX.strokeRect(pl.x, pl.y, pl.w, pl.h);
  });

  // particles
  particles.forEach(pt=>{
    CTX.globalAlpha = Math.max(0, pt.life/24);
    CTX.fillStyle = pt.color;
    CTX.beginPath(); CTX.arc(pt.x, pt.y, 3, 0, Math.PI*2); CTX.fill();
  });
  CTX.globalAlpha = 1;

  players.forEach(p=>drawPlayer(p));

  CTX.restore();

  if(hitstop>0){
    CTX.fillStyle = 'rgba(255,255,255,0.06)';
    CTX.fillRect(0,0,W,H);
  }
}

function drawPlayer(p){
  CTX.save();
  if(p.invincible>0 && Math.floor(p.frameCount/3)%2===0) CTX.globalAlpha = 0.4;
  if(p.state==='shieldbreak') CTX.globalAlpha = 0.6;

  CTX.translate(p.x, p.y);
  // shield bubble
  if(p.isShielding){
    CTX.beginPath();
    CTX.arc(0, -p.h/2, 26*(p.shieldHP/100)+8, 0, Math.PI*2);
    CTX.fillStyle = 'rgba(120,220,255,0.22)';
    CTX.fill();
    CTX.strokeStyle = 'rgba(120,220,255,0.7)'; CTX.lineWidth=2; CTX.stroke();
  }

  // body (flash white briefly on hit)
  const flashing = p.attack && p.attack.hit && p.attack.timer < p.attack.startup+p.attack.active+2;
  CTX.fillStyle = p.color;
  CTX.strokeStyle = 'rgba(255,255,255,0.6)';
  CTX.lineWidth = 2;
  // legs offset for walk/dash animation
  const bob = (p.state==='walk'||p.state==='dash') ? Math.sin(p.frameCount*0.5)*3 : 0;
  CTX.beginPath();
  roundRect(CTX, -p.w/2, -p.h+bob*0.2, p.w, p.h-8, 6);
  CTX.fill(); CTX.stroke();
  // head
  CTX.beginPath();
  CTX.arc(0, -p.h-8, p.w*0.34, 0, Math.PI*2);
  CTX.fill(); CTX.stroke();
  // facing indicator (visor)
  CTX.fillStyle = '#0a0d18';
  CTX.beginPath();
  CTX.arc(p.facing*p.w*0.16, -p.h-8, p.w*0.14, 0, Math.PI*2);
  CTX.fill();

  // attack hitbox visual
  if(p.attack){
    const a=p.attack;
    if(a.timer>=a.startup && a.timer<a.startup+a.active){
      CTX.fillStyle = a.isSmash ? 'rgba(255,207,79,0.55)' : 'rgba(255,255,255,0.35)';
      const hx = p.facing*(p.w/2+a.w/2-6);
      roundRect(CTX, hx-a.w/2, -p.h/2-a.h/2, a.w, a.h, 8);
      CTX.fill();
    }
  }

  // damage% floating (small)
  CTX.restore();
  CTX.save();
  CTX.font = '11px Space Mono';
  CTX.fillStyle = p.color;
  CTX.textAlign='center';
  CTX.fillText(Math.floor(p.damagePercent)+'%', p.x, p.y-p.h-26);
  CTX.restore();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------- SCREEN MANAGEMENT ----------
function show(id){
  ['titleScreen','selectScreen','resultScreen'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s!==id);
  });
  document.getElementById('hud').classList.toggle('hidden', id!=null);
  document.getElementById('timer').classList.toggle('hidden', id!=null);
}

function buildSelectUI(){
  function buildTypes(containerId, playerKey, cls){
    const el = document.getElementById(containerId);
    el.innerHTML='';
    Object.keys(FIGHTER_TYPES).forEach(key=>{
      const chip = document.createElement('div');
      chip.className = 'chip'+(select[playerKey]===key?' active '+cls:'');
      chip.textContent = FIGHTER_TYPES[key].label;
      chip.onclick = ()=>{ select[playerKey]=key; buildSelectUI(); };
      el.appendChild(chip);
    });
  }
  function buildColors(containerId, playerKey){
    const el = document.getElementById(containerId);
    el.innerHTML='';
    COLORS.forEach((c,i)=>{
      const sw = document.createElement('div');
      sw.className='sw'+(select[playerKey]===i?' active':'');
      sw.style.background=c;
      sw.onclick = ()=>{ select[playerKey]=i; buildSelectUI(); };
      el.appendChild(sw);
    });
  }
  buildTypes('p1types','p1type','p1');
  buildTypes('p2types','p2type','p2');
  buildColors('p1colors','p1color');
  buildColors('p2colors','p2color');
  document.getElementById('cpuToggle').textContent = 'CPU: '+(select.p2cpu?'ON':'OFF');
}

document.getElementById('cpuToggle').onclick = ()=>{ select.p2cpu=!select.p2cpu; buildSelectUI(); };
document.getElementById('startMatchBtn').onclick = ()=>{
  gameState='MATCH'; show(null); resetMatch();
};
document.getElementById('rematchBtn').onclick = ()=>{
  gameState='TITLE'; show('titleScreen');
};
window.addEventListener('keydown', e=>{
  if(gameState==='TITLE' && e.code==='Space'){ gameState='SELECT'; show('selectScreen'); buildSelectUI(); }
});

// ---------- LOOP ----------
function loop(){
  requestAnimationFrame(loop);
  if(gameState==='MATCH') updateMatch();
  render();
}
show('titleScreen');
loop();
})();
</script>
