<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARENA CLASH -対戦格闘-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0912;
    --bg2: #12101c;
    --panel: #17141f;
    --panel2: #1e1a2b;
    --border: #2c2740;
    --cyan: #00e5ff;
    --magenta: #ff2f92;
    --yellow: #ffcc33;
    --text: #f2f0f9;
    --muted: #918da3;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,47,146,0.08), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(0,229,255,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    position:relative; width:100%; height:100vh; min-height:600px;
    display:flex; align-items:center; justify-content:center;
  }
  .stage-frame{
    position:relative; width:min(96vw,1040px); aspect-ratio:960/650;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.02);
    overflow:hidden;
  }
  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    padding:clamp(16px,3vw,36px);
  }
  .screen.active{display:flex;}

  /* ---- slash signature element ---- */
  .slash{
    position:absolute; left:-10%; width:120%; height:10px;
    background:linear-gradient(90deg, transparent, var(--cyan) 20%, var(--magenta) 55%, transparent 90%);
    transform:rotate(-6deg);
    opacity:0.9; filter:drop-shadow(0 0 10px rgba(0,229,255,0.6));
  }

  /* ---- title screen ---- */
  #screen-title{align-items:center; justify-content:center; text-align:center; position:relative;}
  #screen-title .slash{top:38%;}
  .logo-en{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(48px,9vw,96px);
    letter-spacing:4px; line-height:0.9;
    background:linear-gradient(90deg, var(--cyan), var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,47,146,0.35));
    margin:0;
  }
  .logo-jp{
    font-weight:900; font-size:clamp(13px,2vw,18px);
    letter-spacing:10px; color:var(--muted); margin-top:6px;
  }
  .menu-btns{display:flex; flex-direction:column; gap:12px; margin-top:44px; width:min(80%,320px);}
  button{
    font-family:'Noto Sans JP',sans-serif; cursor:pointer;
    border-radius:8px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text);
    padding:14px 18px; font-size:15px; font-weight:700;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
    letter-spacing:1px;
  }
  button:hover{border-color:var(--cyan); background:#241f36; transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  button.primary{
    background:linear-gradient(90deg, rgba(0,229,255,0.18), rgba(255,47,146,0.18));
    border-color:var(--cyan);
  }
  button.small{padding:8px 12px; font-size:12px; font-weight:500;}
  button.remap{min-width:96px; font-family:'Space Mono',monospace; font-size:13px;}
  button.remap.listening{border-color:var(--yellow); color:var(--yellow); background:#2a2410;}
  .hint{color:var(--muted); font-size:12px; margin-top:28px; letter-spacing:1px;}

  /* ---- header shared ---- */
  .screen-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .screen-title-text{font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:3px;
    background:linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* ---- key config screen ---- */
  #screen-keyconfig{overflow-y:auto;}
  .kc-cols{display:flex; gap:22px; flex:1; min-height:0;}
  .kc-col{flex:1; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:14px; display:flex; flex-direction:column;}
  .kc-col h3{margin:0 0 10px 0; font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px;}
  .kc-col.p1 h3{color:var(--cyan);}
  .kc-col.p2 h3{color:var(--magenta);}
  .kc-row{display:flex; align-items:center; justify-content:space-between; padding:6px 2px; border-bottom:1px dashed var(--border); font-size:13px;}
  .kc-row:last-child{border-bottom:none;}
  .kc-foot{display:flex; justify-content:space-between; margin-top:16px; gap:10px;}

  /* ---- character select ---- */
  #screen-select{overflow-y:auto;}
  .cs-status{font-size:13px; color:var(--muted); margin-bottom:10px; letter-spacing:1px;}
  .cs-status b{color:var(--yellow);}
  .cs-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; flex:1;}
  .cs-card{
    background:var(--panel2); border:2px solid var(--border); border-radius:8px;
    padding:10px 8px; text-align:center; cursor:pointer; transition:.12s;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .cs-card:hover{border-color:var(--cyan); transform:translateY(-2px);}
  .cs-card .swatch{width:38px; height:38px; border-radius:50%; box-shadow:0 0 14px currentColor;}
  .cs-card .cname{font-weight:700; font-size:12.5px;}
  .cs-card .bars{width:100%; display:flex; flex-direction:column; gap:2px; margin-top:2px;}
  .bar-row{display:flex; align-items:center; gap:4px; font-size:9px; color:var(--muted);}
  .bar-row span:first-child{width:20px; text-align:left;}
  .bar-track{flex:1; height:4px; background:#0d0b16; border-radius:2px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--cyan),var(--magenta));}
  .cs-card.picked-p1{border-color:var(--cyan); box-shadow:0 0 0 2px rgba(0,229,255,0.35);}
  .cs-card.picked-p2{border-color:var(--magenta); box-shadow:0 0 0 2px rgba(255,47,146,0.35);}
  .cs-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}

  /* ---- game screen ---- */
  #screen-game{padding:0;}
  #hud{
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:10px 16px; z-index:5; pointer-events:none;
  }
  .hud-side{display:flex; flex-direction:column; gap:4px; min-width:150px;}
  .hud-side.right{align-items:flex-end;}
  .hud-name{font-size:11px; letter-spacing:2px; font-weight:700;}
  .hud-p1 .hud-name{color:var(--cyan);}
  .hud-p2 .hud-name{color:var(--magenta);}
  .hud-pct{font-family:'Space Mono',monospace; font-size:34px; font-weight:700; line-height:1;}
  .hud-stocks{display:flex; gap:4px;}
  .hud-side.right .hud-stocks{flex-direction:row-reverse;}
  .stock-dot{width:9px; height:9px; border-radius:50%; background:var(--muted);}
  .shieldbar-track{width:150px; height:5px; background:#0d0b16; border-radius:3px; overflow:hidden; margin-top:2px;}
  .shieldbar-fill{height:100%; background:var(--yellow);}
  #backbtn{position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:6; pointer-events:all;}
  canvas{display:block; width:100%; height:100%;}

  /* ---- result ---- */
  #screen-result{align-items:center; justify-content:center; text-align:center;}
  #screen-result .slash{top:32%;}
  #result-name{font-family:'Bebas Neue',sans-serif; font-size:clamp(40px,8vw,72px); letter-spacing:3px; margin:0;}
  #result-sub{color:var(--muted); letter-spacing:2px; margin-top:6px; font-size:13px;}
  .result-btns{display:flex; gap:12px; margin-top:36px;}
</style>
</head>
<body>
<div id="app">
  <div class="stage-frame">

    <!-- TITLE -->
    <div id="screen-title" class="screen active">
      <div class="slash"></div>
      <div>
        <div class="logo-en">ARENA CLASH</div>
        <div class="logo-jp">ローカル対戦アクション</div>
      </div>
      <div class="menu-btns">
        <button class="primary" id="btn-to-select">対戦をはじめる</button>
        <button id="btn-to-keyconfig">キー設定</button>
      </div>
      <div class="hint">同じキーボードで1P / 2P が対戦する形式です（通信・オンライン要素はありません）</div>
    </div>

    <!-- KEY CONFIG -->
    <div id="screen-keyconfig" class="screen">
      <div class="screen-head">
        <div class="screen-title-text">キー設定</div>
        <button class="small" id="btn-kc-back">戻る</button>
      </div>
      <div class="kc-cols">
        <div class="kc-col p1">
          <h3>PLAYER 1</h3>
          <div id="kc-rows-p1"></div>
        </div>
        <div class="kc-col p2">
          <h3>PLAYER 2</h3>
          <div id="kc-rows-p2"></div>
        </div>
      </div>
      <div class="kc-foot">
        <button class="small" id="btn-kc-reset">デフォルトに戻す</button>
        <div class="hint" style="margin:0;">ボタンを押してから、割り当てたいキーを押してください</div>
      </div>
    </div>

    <!-- CHARACTER SELECT -->
    <div id="screen-select" class="screen">
      <div class="screen-head">
        <div class="screen-title-text">キャラクター選択</div>
        <button class="small" id="btn-cs-back">戻る</button>
      </div>
      <div class="cs-status" id="cs-status"><b>PLAYER 1</b> がキャラクターを選択中...</div>
      <div class="cs-grid" id="cs-grid"></div>
      <div class="cs-foot">
        <button class="small" id="btn-cs-reset">選び直す</button>
        <button class="primary" id="btn-cs-start" disabled>対戦開始</button>
      </div>
    </div>

    <!-- GAME -->
    <div id="screen-game" class="screen">
      <div id="hud">
        <div class="hud-side hud-p1">
          <div class="hud-name" id="hud-name-p1">P1</div>
          <div class="hud-pct" id="hud-pct-p1">0%</div>
          <div class="shieldbar-track"><div class="shieldbar-fill" id="hud-shield-p1" style="width:100%"></div></div>
          <div class="hud-stocks" id="hud-stocks-p1"></div>
        </div>
        <div class="hud-side hud-p2 right">
          <div class="hud-name" id="hud-name-p2">P2</div>
          <div class="hud-pct" id="hud-pct-p2">0%</div>
          <div class="shieldbar-track"><div class="shieldbar-fill" id="hud-shield-p2" style="width:100%"></div></div>
          <div class="hud-stocks" id="hud-stocks-p2"></div>
        </div>
      </div>
      <button class="small" id="backbtn">❮ タイトルへ</button>
      <canvas id="canvas" width="960" height="650"></canvas>
    </div>

    <!-- RESULT -->
    <div id="screen-result" class="screen">
      <div class="slash"></div>
      <div>
        <div id="result-name">PLAYER 1 WINS</div>
        <div id="result-sub">RESULT</div>
      </div>
      <div class="result-btns">
        <button class="primary" id="btn-res-rematch">キャラ選択に戻る</button>
        <button id="btn-res-title">タイトルへ</button>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
"use strict";

/* ===================== DATA ===================== */

const CHARACTERS = [
  {id:'blaze',  name:'ブレイズ',   color:'#ff5a36', speed:6, power:8, weight:5, jump:6},
  {id:'aqua',   name:'アクア',     color:'#2fb8ff', speed:7, power:5, weight:5, jump:7},
  {id:'volt',   name:'ボルト',     color:'#ffe14d', speed:9, power:4, weight:3, jump:8},
  {id:'rock',   name:'ロック',     color:'#a97b4f', speed:3, power:9, weight:9, jump:4},
  {id:'shadow', name:'シャドウ',   color:'#8a5cff', speed:7, power:6, weight:5, jump:6},
  {id:'mist',   name:'ミスト',     color:'#7fe0c9', speed:6, power:5, weight:4, jump:7},
  {id:'ember',  name:'エンバー',   color:'#ff3f6b', speed:5, power:7, weight:6, jump:5},
  {id:'steel',  name:'スチール',   color:'#c3ccd6', speed:4, power:7, weight:10,jump:3},
  {id:'gale',   name:'ゲイル',     color:'#5dffa0', speed:10,power:3, weight:3, jump:9},
  {id:'crystal',name:'クリスタル', color:'#ff8ff0', speed:5, power:6, weight:5, jump:6},
];

const ACTIONS = [
  {key:'left',   label:'左'},
  {key:'right',  label:'右'},
  {key:'up',     label:'上'},
  {key:'down',   label:'下'},
  {key:'jump',   label:'ジャンプ'},
  {key:'guard',  label:'ガード'},
  {key:'grab',   label:'つかみ'},
  {key:'attack', label:'攻撃'},
  {key:'special',label:'特殊攻撃'},
  {key:'dash',   label:'ダッシュ'},
];

const DEFAULT_KEYS = {
  p1:{left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',jump:'Space',guard:'KeyF',grab:'KeyG',attack:'KeyH',special:'KeyJ',dash:'ShiftLeft'},
  p2:{left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',jump:'Enter',guard:'KeyK',grab:'KeyL',attack:'Semicolon',special:'Quote',dash:'ShiftRight'}
};
let keybinds = JSON.parse(JSON.stringify(DEFAULT_KEYS));

function codeLabel(code){
  if(!code) return '---';
  const map = {Space:'Space',ShiftLeft:'ShiftL',ShiftRight:'ShiftR',ArrowLeft:'←',ArrowRight:'→',
    ArrowUp:'↑',ArrowDown:'↓',Enter:'Enter',Semicolon:';',Quote:"'",ControlLeft:'CtrlL',
    ControlRight:'CtrlR',AltLeft:'AltL',AltRight:'AltR',Backslash:'\\\\',Comma:',',Period:'.',Slash:'/'};
  if(map[code]) return map[code];
  if(code.startsWith('Key')) return code.slice(3);
  if(code.startsWith('Digit')) return code.slice(5);
  return code;
}

/* ===================== STATE ===================== */

let screen = 'title';
let selected = {p1:null, p2:null};
let pickTurn = 'p1';
let remapTarget = null; // {player,key,btn}

/* ===================== SCREEN SWITCH ===================== */

function showScreen(name){
  screen = name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}

/* ===================== KEY CONFIG UI ===================== */

function buildKeyConfigRows(){
  for(const p of ['p1','p2']){
    const wrap = document.getElementById('kc-rows-'+p);
    wrap.innerHTML = '';
    ACTIONS.forEach(a=>{
      const row = document.createElement('div');
      row.className = 'kc-row';
      const label = document.createElement('span');
      label.textContent = a.label;
      const btn = document.createElement('button');
      btn.className = 'remap';
      btn.textContent = codeLabel(keybinds[p][a.key]);
      btn.addEventListener('click', ()=>startRemap(p,a.key,btn));
      row.appendChild(label); row.appendChild(btn);
      wrap.appendChild(row);
    });
  }
}

function startRemap(player,key,btn){
  if(remapTarget) { remapTarget.btn.classList.remove('listening'); remapTarget.btn.textContent = codeLabel(keybinds[remapTarget.player][remapTarget.key]); }
  remapTarget = {player,key,btn};
  btn.textContent = 'キー入力...';
  btn.classList.add('listening');
}

window.addEventListener('keydown', (e)=>{
  if(remapTarget){
    e.preventDefault();
    keybinds[remapTarget.player][remapTarget.key] = e.code;
    remapTarget.btn.textContent = codeLabel(e.code);
    remapTarget.btn.classList.remove('listening');
    remapTarget = null;
    return;
  }
  if(screen === 'game'){
    keysDown.add(e.code);
    if(Object.values(keybinds.p1).includes(e.code) || Object.values(keybinds.p2).includes(e.code)){
      e.preventDefault();
    }
  }
});
window.addEventListener('keyup', (e)=>{
  if(screen === 'game'){ keysDown.delete(e.code); }
});

document.getElementById('btn-to-keyconfig').addEventListener('click', ()=>{ buildKeyConfigRows(); showScreen('keyconfig'); });
document.getElementById('btn-kc-back').addEventListener('click', ()=> showScreen('title'));
document.getElementById('btn-kc-reset').addEventListener('click', ()=>{
  keybinds = JSON.parse(JSON.stringify(DEFAULT_KEYS));
  buildKeyConfigRows();
});

/* ===================== CHARACTER SELECT UI ===================== */

function buildCharSelect(){
  selected = {p1:null,p2:null};
  pickTurn = 'p1';
  updateCsStatus();
  document.getElementById('btn-cs-start').disabled = true;
  const grid = document.getElementById('cs-grid');
  grid.innerHTML = '';
  CHARACTERS.forEach(ch=>{
    const card = document.createElement('div');
    card.className = 'cs-card';
    card.dataset.id = ch.id;
    card.innerHTML =
      '<div class="swatch" style="background:'+ch.color+';color:'+ch.color+'"></div>'+
      '<div class="cname">'+ch.name+'</div>'+
      '<div class="bars">'+
        barRow('速',ch.speed)+barRow('力',ch.power)+barRow('重',ch.weight)+barRow('跳',ch.jump)+
      '</div>';
    card.addEventListener('click', ()=> pickCharacter(ch));
    grid.appendChild(card);
  });
}
function barRow(label,val){
  const pct = Math.round(val/10*100);
  return '<div class="bar-row"><span>'+label+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
}
function updateCsStatus(){
  const el = document.getElementById('cs-status');
  if(!selected.p1) el.innerHTML = '<b>PLAYER 1</b> がキャラクターを選択中...';
  else if(!selected.p2) el.innerHTML = '<b>PLAYER 2</b> がキャラクターを選択中...';
  else el.innerHTML = '両者の選択が完了しました。<b>対戦開始</b>を押してください。';
}
function pickCharacter(ch){
  if(!selected.p1){ selected.p1 = ch; }
  else if(!selected.p2){ selected.p2 = ch; }
  else return;
  document.querySelectorAll('.cs-card').forEach(c=>{
    c.classList.remove('picked-p1','picked-p2');
    if(selected.p1 && c.dataset.id === selected.p1.id) c.classList.add('picked-p1');
    if(selected.p2 && c.dataset.id === selected.p2.id) c.classList.add('picked-p2');
  });
  updateCsStatus();
  document.getElementById('btn-cs-start').disabled = !(selected.p1 && selected.p2);
}
document.getElementById('btn-to-select').addEventListener('click', ()=>{ buildCharSelect(); showScreen('select'); });
document.getElementById('btn-cs-back').addEventListener('click', ()=> showScreen('title'));
document.getElementById('btn-cs-reset').addEventListener('click', buildCharSelect);
document.getElementById('btn-cs-start').addEventListener('click', ()=>{ startGame(selected.p1, selected.p2); });
document.getElementById('btn-res-rematch').addEventListener('click', ()=>{ buildCharSelect(); showScreen('select'); });
document.getElementById('btn-res-title').addEventListener('click', ()=> showScreen('title'));
document.getElementById('backbtn').addEventListener('click', ()=>{ gameRunning=false; showScreen('title'); });

/* ===================== GAME ENGINE ===================== */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;
const GROUND_Y = 460;
const STAGE_L = 160, STAGE_R = 800;

const keysDown = new Set();
let prevKeysDown = new Set();

const ATTACKS = {
  jab:      {startup:5,  active:5,  recover:10, dmg:3, kbBase:3, kbGrowth:0.10, kx:1,  ky:-0.15, w:46, h:26, ox:30, oy:14, type:'atk'},
  upAtk:    {startup:6,  active:6,  recover:14, dmg:4, kbBase:4, kbGrowth:0.12, kx:0.25,ky:-1,    w:34, h:40, ox:6,  oy:-30,type:'atk'},
  downAtk:  {startup:5,  active:6,  recover:14, dmg:4, kbBase:4, kbGrowth:0.10, kx:0.6, ky:0.4,   w:44, h:20, ox:26, oy:38, type:'atk'},
  strong:   {startup:16, active:6,  recover:22, dmg:9, kbBase:8, kbGrowth:0.22, kx:1,  ky:-0.35, w:56, h:30, ox:34, oy:10, type:'atk'},
  grab:     {startup:8,  active:6,  recover:16, dmg:5, kbBase:6, kbGrowth:0.14, kx:1,  ky:-0.4,  w:34, h:34, ox:26, oy:8,  type:'grab'},
  spNeutral:{startup:12, active:8,  recover:18, dmg:5, kbBase:6, kbGrowth:0.16, kx:1,  ky:-0.25, w:40, h:26, ox:32, oy:12, type:'atk'},
  spUp:     {startup:8,  active:10, recover:16, dmg:6, kbBase:7, kbGrowth:0.16, kx:0.3, ky:-1,    w:44, h:56, ox:2,  oy:-40,type:'atk'},
  spDown:   {startup:10, active:8,  recover:18, dmg:7, kbBase:8, kbGrowth:0.18, kx:0.3, ky:0.9,   w:50, h:26, ox:16, oy:36, type:'atk'},
  spSide:   {startup:8,  active:10, recover:16, dmg:6, kbBase:7, kbGrowth:0.15, kx:1,  ky:-0.2,  w:52, h:30, ox:36, oy:12, type:'atk'},
  dashHit:  {startup:0,  active:999,recover:0,  dmg:3, kbBase:3, kbGrowth:0.08, kx:1,  ky:-0.2,  w:40, h:30, ox:10, oy:10, type:'atk'},
};

function makePlayer(idx, ch, x, facing, keys){
  return {
    idx, char:ch, keys,
    x, y:GROUND_Y-64, w:40, h:64, vx:0, vy:0, facing,
    onGround:true, jumpsLeft:1,
    action:'idle', actionFrame:0, activeProfile:null, hitDone:false,
    hitstun:0, invuln:0,
    damage:0, stocks:3,
    shield:100, dashDir:0,
  };
}

let P1=null, P2=null, gameRunning=false, matchOver=false;

function keyHeld(p, name){ return keysDown.has(p.keys[name]); }
function keyPressed(p, name){ return keysDown.has(p.keys[name]) && !prevKeysDown.has(p.keys[name]); }

function startGame(ch1, ch2){
  P1 = makePlayer(1, ch1, 300, 1, keybinds.p1);
  P2 = makePlayer(2, ch2, 620, -1, keybinds.p2);
  matchOver = false;
  document.getElementById('hud-name-p1').textContent = ch1.name;
  document.getElementById('hud-name-p2').textContent = ch2.name;
  renderStocks(P1); renderStocks(P2);
  showScreen('game');
  gameRunning = true;
  keysDown.clear(); prevKeysDown.clear();
  requestAnimationFrame(loop);
}

function renderStocks(p){
  const el = document.getElementById('hud-stocks-p'+p.idx);
  el.innerHTML = '';
  for(let i=0;i<p.stocks;i++){
    const d = document.createElement('div');
    d.className = 'stock-dot';
    d.style.background = p.char.color;
    el.appendChild(d);
  }
}

function startAction(p, name, profile){
  p.action = name;
  p.actionFrame = 0;
  p.activeProfile = profile;
  p.hitDone = false;
  if(name === 'dash'){ p.dashDir = p.facing; }
}

function applyHit(attacker, victim, profile){
  if(victim.invuln>0 || victim.hitDone) {}
  if(attacker.hitDone) return;
  if(victim.action==='guard' && profile.type!=='grab'){
    victim.shield -= (profile.dmg*3 + 6);
    if(victim.shield<=0){
      victim.shield = 0;
      startAction(victim,'hitstun',null);
      victim.hitstun = 100;
    }
    attacker.hitDone = true;
    return;
  }
  victim.damage += profile.dmg;
  const kbMag = (profile.kbBase*10 + profile.kbGrowth*victim.damage*10) * (11/victim.char.weight) * 0.06;
  const dirX = profile.kx * attacker.facing;
  victim.vx = dirX * kbMag * 0.5;
  victim.vy = profile.ky * kbMag * 0.5;
  startAction(victim,'hitstun',null);
  victim.hitstun = Math.min(75, Math.max(8, kbMag*3));
  victim.onGround = false;
  attacker.hitDone = true;
}

function hurtboxOf(p){ return {x:p.x, y:p.y, w:p.w, h:p.h}; }
function hitboxOf(p, profile){
  const dir = p.facing;
  const x = dir>0 ? p.x + p.w/2 + profile.ox - profile.w/2 : p.x + p.w/2 - profile.ox - profile.w/2;
  const y = p.y + p.h/2 + profile.oy - profile.h/2;
  return {x,y,w:profile.w,h:profile.h};
}
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function updatePlayer(p, opp){
  const moveSpeed = p.char.speed*0.55 + 2.2;
  const jumpPower = p.char.jump*1.35 + 8;
  const dashSpeed = p.char.speed*0.85 + 6;

  const canAct = (p.action==='idle' || p.action==='run');
  const upH = keyHeld(p,'up'), downH = keyHeld(p,'down');
  const leftH = keyHeld(p,'left'), rightH = keyHeld(p,'right');

  // --- state machine input ---
  if(p.action==='hitstun'){
    p.hitstun--;
    if(p.hitstun<=0){ p.action = p.onGround ? 'idle' : 'idle'; }
  } else if(p.action==='guard'){
    if(!keyHeld(p,'guard')){ p.action='idle'; }
    else { p.shield = Math.max(0,p.shield-0.35); if(p.shield<=0){ startAction(p,'hitstun',null); p.hitstun=90; } }
  } else if(p.action==='dash'){
    p.actionFrame++;
    p.vx = p.dashDir * dashSpeed;
    if(p.action==='dash' && !p.hitDone && overlap(hitboxOf(p,ATTACKS.dashHit), hurtboxOf(opp))){
      applyHit(p,opp,ATTACKS.dashHit);
    }
    if(p.actionFrame>16){ p.action='idle'; }
  } else if(p.action==='attack' || p.action==='special' || p.action==='grab'){
    p.actionFrame++;
    const prof = p.activeProfile;
    const total = prof.startup+prof.active+prof.recover;
    if(p.actionFrame>=prof.startup && p.actionFrame<prof.startup+prof.active && !p.hitDone){
      if(overlap(hitboxOf(p,prof), hurtboxOf(opp))) applyHit(p,opp,prof);
    }
    if(p.actionFrame>=total){ p.action='idle'; p.hitDone=false; }
  }

  // --- fresh input while free ---
  if(p.action==='idle' || p.action==='run'){
    if(keyPressed(p,'grab')){ startAction(p,'grab',ATTACKS.grab); }
    else if(keyPressed(p,'attack')){
      if(upH) startAction(p,'attack',ATTACKS.upAtk);
      else if(downH) startAction(p,'attack',ATTACKS.downAtk);
      else if((leftH&&p.facing<0)||(rightH&&p.facing>0)) startAction(p,'attack',ATTACKS.strong);
      else startAction(p,'attack',ATTACKS.jab);
    } else if(keyPressed(p,'special')){
      if(upH) startAction(p,'special',ATTACKS.spUp);
      else if(downH) startAction(p,'special',ATTACKS.spDown);
      else if(leftH||rightH) startAction(p,'special',ATTACKS.spSide);
      else startAction(p,'special',ATTACKS.spNeutral);
    } else if(keyPressed(p,'dash') && p.onGround){
      startAction(p,'dash',null);
    } else if(keyHeld(p,'guard') && p.onGround){
      p.action='guard';
    }
  }

  // --- movement (only when not locked in an action) ---
  const locked = (p.action==='attack'||p.action==='special'||p.action==='grab'||p.action==='hitstun'||p.action==='guard'||p.action==='dash');
  if(!locked){
    let dir = 0;
    if(leftH) dir = -1;
    if(rightH) dir = 1;
    if(dir!==0){ p.facing = dir; p.vx += (dir*moveSpeed - p.vx)*0.35; p.action = p.onGround ? 'run' : p.action; }
    else { p.vx *= 0.78; if(p.onGround) p.action='idle'; }
  } else {
    if(p.action!=='dash') p.vx *= 0.9;
  }

  // jump
  if((p.action==='idle'||p.action==='run') && keyPressed(p,'jump')){
    if(p.onGround){ p.vy = -jumpPower; p.onGround=false; p.jumpsLeft=1; }
    else if(p.jumpsLeft>0){ p.vy = -jumpPower*0.85; p.jumpsLeft--; }
  }

  // fastfall
  if(downH && !p.onGround && p.vy>0){ p.vy = Math.min(p.vy+1.2, 20); }

  // gravity & physics
  p.vy += 0.62;
  if(p.vy>16) p.vy=16;
  p.x += p.vx;
  p.y += p.vy;

  // ground collision (platform only within stage bounds)
  if(p.x+p.w>STAGE_L && p.x<STAGE_R && p.y+p.h>=GROUND_Y && p.vy>=0){
    p.y = GROUND_Y - p.h;
    p.vy = 0;
    if(!p.onGround){ p.onGround = true; p.jumpsLeft=1; }
    p.onGround = true;
  } else {
    p.onGround = false;
  }

  if(p.invuln>0) p.invuln--;
}

function checkBlast(p){
  if(p.x+p.w < STAGE_L-160 || p.x > STAGE_R+160 || p.y > CH+160 || p.y < -260){
    p.stocks--;
    renderStocks(p);
    p.damage = 0;
    p.x = p.idx===1 ? 300 : 620;
    p.y = GROUND_Y-64-40;
    p.vx=0; p.vy=0;
    p.action='idle';
    p.invuln = 90;
    if(p.stocks<=0){ endMatch(p.idx===1?P2:P1); }
  }
}

function endMatch(winner){
  matchOver = true;
  gameRunning = false;
  document.getElementById('result-name').textContent = winner.char.name + ' の勝ち！';
  document.getElementById('result-sub').textContent = 'PLAYER ' + winner.idx + ' WINS';
  showScreen('result');
}

function drawRoundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawPlayer(p){
  ctx.save();
  if(p.invuln>0 && Math.floor(p.invuln/4)%2===0){ ctx.globalAlpha=0.35; }
  if(p.action==='hitstun'){ ctx.globalAlpha=0.75; }
  ctx.fillStyle = p.char.color;
  drawRoundedRect(p.x,p.y,p.w,p.h,10);
  ctx.fill();
  // face direction indicator (eye)
  ctx.fillStyle = '#0a0912';
  const eyeX = p.facing>0 ? p.x+p.w-12 : p.x+4;
  ctx.beginPath(); ctx.arc(eyeX, p.y+18, 4, 0, Math.PI*2); ctx.fill();
  // guard shield visual
  if(p.action==='guard'){
    ctx.strokeStyle='rgba(255,204,51,0.8)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x+p.w/2,p.y+p.h/2,p.w*0.9,0,Math.PI*2); ctx.stroke();
  }
  // active hitbox debug flash
  if((p.action==='attack'||p.action==='special'||p.action==='grab') && p.activeProfile){
    const prof=p.activeProfile;
    if(p.actionFrame>=prof.startup && p.actionFrame<prof.startup+prof.active){
      const hb = hitboxOf(p,prof);
      ctx.fillStyle = prof.type==='grab' ? 'rgba(255,204,51,0.55)' : 'rgba(255,255,255,0.5)';
      drawRoundedRect(hb.x,hb.y,hb.w,hb.h,6); ctx.fill();
    }
  }
  ctx.restore();
}

function drawStage(){
  ctx.clearRect(0,0,CW,CH);
  // backdrop
  const grad = ctx.createLinearGradient(0,0,0,CH);
  grad.addColorStop(0,'#181428'); grad.addColorStop(1,'#0c0a16');
  ctx.fillStyle = grad; ctx.fillRect(0,0,CW,CH);
  for(let i=0;i<3;i++){
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.beginPath(); ctx.moveTo(0,120+i*90); ctx.lineTo(CW,90+i*90); ctx.stroke();
  }
  // platform
  ctx.fillStyle = '#221d33';
  drawRoundedRect(STAGE_L-10, GROUND_Y, STAGE_R-STAGE_L+20, 40, 8); ctx.fill();
  ctx.fillStyle = '#00e5ff';
  ctx.fillRect(STAGE_L-10, GROUND_Y, STAGE_R-STAGE_L+20, 3);
  ctx.fillStyle = 'rgba(255,47,146,0.6)';
  ctx.fillRect(STAGE_L-10, GROUND_Y+37, STAGE_R-STAGE_L+20, 3);
}

function updateHud(){
  document.getElementById('hud-pct-p1').textContent = Math.round(P1.damage)+'%';
  document.getElementById('hud-pct-p2').textContent = Math.round(P2.damage)+'%';
  document.getElementById('hud-pct-p1').style.color = P1.damage>100 ? '#ff2f92' : '#ffcc33';
  document.getElementById('hud-pct-p2').style.color = P2.damage>100 ? '#ff2f92' : '#ffcc33';
  document.getElementById('hud-shield-p1').style.width = P1.shield+'%';
  document.getElementById('hud-shield-p2').style.width = P2.shield+'%';
}

function loop(){
  if(!gameRunning) return;
  updatePlayer(P1,P2);
  updatePlayer(P2,P1);
  checkBlast(P1);
  checkBlast(P2);
  if(matchOver) return;
  drawStage();
  drawPlayer(P1);
  drawPlayer(P2);
  updateHud();
  prevKeysDown = new Set(keysDown);
  requestAnimationFrame(loop);
}

buildKeyConfigRows();
})();
</script>
